# GreatBus centralized configuration
# Store this file in the Config Server Git repository.
# Each document is activated by one service-specific profile.
# Set SPRING_PROFILES_ACTIVE equal to the service profile in that service's local bootstrap config.
# Config Server import/authentication settings belong in each client's local bootstrap config, not here.
# Every database-enabled service below uses the same MySQL schema: greatbus_core.
# Each service has a separate Flyway history table; migration-created business table names
# must also be unique across services when sharing one physical schema.

